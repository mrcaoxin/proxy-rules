name: 更新安卓规则脚本

on:
  push:
    branches: [main]
    paths:
      - 'rules/exchanges.list'
      - 'scripts/build.mjs'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.*
      - name: 保存生成的脚本
        run: |
          if ! git diff --quiet -- flclash.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flclash.js
            git commit -m 'build: update exchange rules script'
            git push
          fi
